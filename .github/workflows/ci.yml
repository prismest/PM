name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify Swift Toolchain
        run: swift --version

      - name: Build Waan (Release)
        run: swift build -c release

      - name: Package macOS App Bundle
        run: ./build_app.sh

      - name: Run Test Suite
        run: make test

